name: Build Android APK

# Run this by hand from the Actions tab; the APK appears as a downloadable artifact,
# so no Android Studio is needed on any machine.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: harf-bi-harf-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
